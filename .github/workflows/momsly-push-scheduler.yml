# ==========================================================================
# MOMSLY — PUSH REMINDER SCHEDULER
# Free alternative to Supabase pg_cron: calls the send-push-notification
# Edge Function on a schedule, which then finds due reminders and sends
# Web Push notifications for them.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_EDGE_FUNCTION_URL   e.g. https://xxxx.supabase.co/functions/v1/send-push-notification
#   SUPABASE_ANON_KEY            your project's anon/public key
#   CRON_SECRET                  a random string you generate yourself —
#                                 must match the CRON_SECRET Edge Function secret
# ==========================================================================
name: Momsly Push Reminder Scheduler

on:
  schedule:
    # GitHub's schedule trigger is best-effort and can drift a few
    # minutes under load — fine for reminder granularity, not something
    # to rely on for split-second timing.
   - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  trigger-push:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-push-notification Edge Function
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.SUPABASE_EDGE_FUNCTION_URL }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP status: $http_code"
          echo "Response: $body"
          if [ "$http_code" -ge 400 ]; then
            echo "Edge Function call failed"
            exit 1
          fi
