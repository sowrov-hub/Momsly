name: Momsly Push Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Supabase Edge Function
        run: |
          curl -X POST \
            "${{ secrets.MOMSLY_SUPABASE_FUNCTION_URL }}" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.MOMSLY_CRON_SECRET }}"
