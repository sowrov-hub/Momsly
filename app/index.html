<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momsly — Your Smart Parenting Companion</title>
<meta name="description" content="Momsly is your smart parenting companion: feeding & sleep tracking, reminders, milestones, and calm daily guidance for new moms.">
<meta name="theme-color" content="#F472B6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="app-shell">
  <div id="app-header-mount"></div>

  <main class="screen">
    <div id="trial-banner-mount"></div>

    <div class="hero" id="home-hero">
      <div class="hero-eyebrow">Loading…</div>
      <h1>Welcome to Momsly</h1>
    </div>

    <div class="hero-illustration-card">
      <div class="hero-illustration-card__stage">
        <div class="hero-illustration-card__glow hero-illustration-card__glow--1"></div>
        <div class="hero-illustration-card__glow hero-illustration-card__glow--2"></div>
        <img src="assets/images/hero-mom-baby.png" alt="Mother holding her sleeping baby">
      </div>
    </div>

    <div class="hero-stats-card" id="hero-stats-card"></div>

    <div class="quick-actions" id="quick-actions"></div>

    <div class="section">
      <div class="section-head"><h2>Today</h2></div>
      <div id="today-summary"></div>
    </div>

    <div class="section" id="daily-tip"></div>

    <div class="section">
      <div class="section-head">
        <h2>Featured tools</h2>
        <a class="link" href="tools.html">See all</a>
      </div>
      <div class="tool-grid" id="recent-tools"></div>
    </div>
  </main>

  <div id="bottom-nav-mount"></div>
</div>

<!-- Today item detail sheet -->
<div class="overlay" id="sheet-today-detail">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2 id="today-detail-title">Details</h2><button class="icon-btn" data-close-sheet></button></div>
    <div id="today-detail-body"></div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script src="js/auth.js"></script>
<script src="js/notification.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/push.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/feeding.js"></script>
<script src="js/sleep.js"></script>
<script src="js/charts.js"></script>
<script src="js/export.js"></script>
<script src="js/share.js"></script>
<script src="js/backup.js"></script>
<script src="js/logic.js"></script>
<script src="js/milestones.js"></script>
<script src="js/tools.js"></script>
<script src="js/tracker.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
<script src="js/router.js"></script>
<script>
  App.mountShell({ title: 'Momsly', activeHref: 'index.html' });
  HomePage.init();
</script>
</body>
</html>
