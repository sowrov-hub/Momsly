<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask Momsly — Momsly</title>
<meta name="theme-color" content="#F472B6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,500&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="app-shell ai-shell">
  <div id="app-header-mount"></div>

  <main class="screen ai-screen">
    <div class="ai-disclaimer">
      <span>Momsly's assistant offers general guidance, not medical advice. For anything urgent or about symptoms, contact your pediatrician or emergency services.</span>
    </div>

    <div class="card" id="ai-setup-notice" style="display:none;margin-bottom:var(--space-md);">
      <p class="subtext">The assistant isn't connected yet. Once the <code>ask-momsly</code> function is deployed and a Gemini key is set, answers will appear here.</p>
    </div>

    <div class="ai-thread" id="ai-thread"></div>

    <form class="ai-composer" id="ai-form">
      <textarea id="ai-input" rows="1" placeholder="Ask about sleep, feeding, milestones…" autocomplete="off"></textarea>
      <button class="ai-send" id="ai-send" type="submit" aria-label="Send question"></button>
    </form>
  </main>

  <div id="bottom-nav-mount"></div>
</div>

<script defer src="js/utils.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/icons.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/components.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/notification.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="js/supabase-client.js"></script>
<script defer src="js/push.js"></script>
<script defer src="js/scheduler.js"></script>
<script defer src="js/feeding.js"></script>
<script defer src="js/sleep.js"></script>
<script defer src="js/charts.js"></script>
<script defer src="js/export.js"></script>
<script defer src="js/share.js"></script>
<script defer src="js/backup.js"></script>
<script defer src="js/logic.js"></script>
<script defer src="js/milestones.js"></script>
<script defer src="js/ai.js"></script>
<script defer src="js/tools.js"></script>
<script defer src="js/tracker.js"></script>
<script defer src="js/pages.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/router.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  (async () => {
    await Auth.init();
    App.mountShell({ title: 'Ask Momsly', activeHref: '', showBack: true, backHref: 'index.html' });
    document.getElementById('ai-send').innerHTML = Icons.chevronRight;
    document.querySelector('.app-header__actions')?.insertAdjacentHTML('afterbegin',
      `<button class="icon-btn" id="ai-clear" aria-label="Clear conversation">${Icons.trash}</button>`);
    MomslyAI.init();
  })();
});
</script>
</body>
</html>
