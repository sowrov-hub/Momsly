<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're Offline — Momsly</title>
<meta name="theme-color" content="#F472B6">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,500&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="offline-screen">
  <div class="brand-mark"></div>
  <h1 style="font-size:var(--fs-2xl);margin-bottom:8px;">You're offline</h1>
  <p class="subtext" style="margin-bottom:24px;">No connection right now — but your tracker logs, reminders, and saved tools are all still here. Anything you add will be right where you left it once you're back online.</p>
  <button class="btn btn--primary" id="retry-btn" style="width:auto;padding-left:32px;padding-right:32px;">Try Again</button>
  <a href="index.html" style="margin-top:16px;font-size:14px;color:var(--color-primary);font-weight:700;">Go to Home</a>
</div>

<script defer src="js/icons.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.querySelector('.brand-mark').innerHTML = Icons.wifiOff;
    document.getElementById('retry-btn').addEventListener('click', () => window.location.href = 'index.html');
});
</script>
</body>
</html>
