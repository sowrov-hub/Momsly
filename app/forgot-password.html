<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Password — Momsly</title>
<meta name="theme-color" content="#F472B6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="auth-screen">
  <div class="auth-blob"></div>
  <div class="auth-blob auth-blob--2"></div>
  <div class="auth-content">
    <div class="auth-logo">
      <img class="brand-mark" src="assets/icons/icon-192.png" alt="Momsly">
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Enter your account email and choose a new password.</p>
    </div>

    <form id="reset-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="new-password">New password</label>
        <div class="password-wrap">
          <input type="password" id="new-password" placeholder="At least 6 characters" required minlength="6">
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password"></button>
        </div>
      </div>
      <button class="btn btn--primary" type="submit" id="reset-submit">Reset Password</button>
    </form>

    <div class="auth-footer">
      Remembered it? <a href="login.html">Back to log in</a>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script src="js/auth.js"></script>
<script src="js/notification.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/push.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/feeding.js"></script>
<script src="js/sleep.js"></script>
<script src="js/charts.js"></script>
<script src="js/export.js"></script>
<script src="js/share.js"></script>
<script src="js/backup.js"></script>
<script src="js/logic.js"></script>
<script src="js/milestones.js"></script>
<script src="js/tools.js"></script>
<script src="js/tracker.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
<script src="js/router.js"></script>
<script>
  document.getElementById('toggle-password').innerHTML = Icons.eye;
  document.getElementById('toggle-password').addEventListener('click', () => {
    const input = document.getElementById('new-password');
    const isPw = input.type === 'password';
    input.type = isPw ? 'text' : 'password';
    document.getElementById('toggle-password').innerHTML = isPw ? Icons.eyeOff : Icons.eye;
  });

  document.getElementById('reset-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const newPassword = document.getElementById('new-password').value;
    const btn = document.getElementById('reset-submit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Resetting…';

    setTimeout(() => {
      const result = Auth.resetPassword({ email, newPassword });
      btn.disabled = false;
      btn.textContent = 'Reset Password';
      if (!result.ok) { UI.toast(result.error, 'error'); return; }
      UI.toast('Password reset! You can log in now.', 'success');
      setTimeout(() => window.location.href = 'login.html', 900);
    }, 500);
  });
</script>
</body>
</html>
