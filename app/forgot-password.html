<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Password — Momsly</title>
<meta name="theme-color" content="#F472B6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="auth-screen">
  <div class="auth-blob"></div>
  <div class="auth-blob auth-blob--2"></div>
  <div class="auth-content">
    <div class="auth-logo">
      <img class="brand-mark" src="assets/icons/icon-192.png" alt="Momsly">
      <h1 class="auth-title" id="page-title">Reset your password</h1>
      <p class="auth-subtitle" id="page-subtitle">Enter your account email and we'll send you a reset link.</p>
    </div>

    <!-- Step 1: request a reset email -->
    <form id="request-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button class="btn btn--primary" type="submit" id="request-submit">Send Reset Link</button>
    </form>

    <!-- Step 2: set a new password (shown after clicking the emailed link) -->
    <form id="update-form" style="display:none;">
      <div class="field">
        <label for="new-password">New password</label>
        <div class="password-wrap">
          <input type="password" id="new-password" placeholder="At least 6 characters" required minlength="6">
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password"></button>
        </div>
      </div>
      <button class="btn btn--primary" type="submit" id="update-submit">Set New Password</button>
    </form>

    <div class="auth-footer">
      Remembered it? <a href="login.html">Back to log in</a>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script src="js/auth.js"></script>
<script src="js/notification.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/push.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/feeding.js"></script>
<script src="js/sleep.js"></script>
<script src="js/charts.js"></script>
<script src="js/export.js"></script>
<script src="js/share.js"></script>
<script src="js/backup.js"></script>
<script src="js/logic.js"></script>
<script src="js/milestones.js"></script>
<script src="js/tools.js"></script>
<script src="js/tracker.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
<script src="js/router.js"></script>
<script>
(async () => {
  document.getElementById('toggle-password').innerHTML = Icons.eye;
  document.getElementById('toggle-password').addEventListener('click', () => {
    const input = document.getElementById('new-password');
    const isPw = input.type === 'password';
    input.type = isPw ? 'text' : 'password';
    document.getElementById('toggle-password').innerHTML = isPw ? Icons.eyeOff : Icons.eye;
  });

  function showUpdateForm() {
    document.getElementById('request-form').style.display = 'none';
    document.getElementById('update-form').style.display = 'block';
    document.getElementById('page-title').textContent = 'Choose a new password';
    document.getElementById('page-subtitle').textContent = "You're verified — set a new password to finish.";
  }

  // Supabase's client auto-detects the recovery token in the URL (from
  // the emailed link) and fires this event once it's created a
  // temporary recovery session — that's our cue to show step 2.
  const client = SupabaseClient.get();
  if (client) {
    client.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') showUpdateForm();
    });
    // Also handles the case where the event fired before this listener
    // was attached (e.g. very fast page load).
    const { data: { session } } = await client.auth.getSession();
    if (session && window.location.hash.includes('type=recovery')) showUpdateForm();
  }

  document.getElementById('request-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const btn = document.getElementById('request-submit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Sending…';

    const result = await Auth.requestPasswordReset(email);
    btn.disabled = false;
    btn.textContent = 'Send Reset Link';
    if (!result.ok) { UI.toast(result.error, 'error'); return; }

    document.getElementById('request-form').style.display = 'none';
    document.getElementById('page-title').textContent = 'Check your email';
    document.getElementById('page-subtitle').textContent = `We sent a reset link to ${email}. Open it on this device to continue.`;
  });

  document.getElementById('update-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('new-password').value;
    const btn = document.getElementById('update-submit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Saving…';

    const result = await Auth.updatePassword(newPassword);
    btn.disabled = false;
    btn.textContent = 'Set New Password';
    if (!result.ok) { UI.toast(result.error, 'error'); return; }

    UI.toast('Password updated! Taking you to Momsly…', 'success');
    setTimeout(() => window.location.href = 'index.html', 900);
  });
})();
</script>
</body>
</html>
