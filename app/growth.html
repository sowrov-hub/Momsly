<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growth Tracker — Momsly</title>
<meta name="theme-color" content="#F472B6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,500&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="app-shell">
  <div id="app-header-mount"></div>

  <main class="screen">
    <header class="mh-head">
      <h1>Growth Tracker</h1>
      <p>Weight and height in one place, charted over time.</p>
    </header>

    <div class="mh-metrics" id="growth-summary" style="margin-bottom:var(--space-xl);"></div>

    <div class="segmented" id="growth-tabs" style="margin-bottom:var(--space-lg);"></div>

    <section class="section">
      <div class="card" id="growth-form"></div>
    </section>

    <section class="section card chart-card" id="growth-chart-wrap">
      <div class="chart-card__head">
        <span class="chart-card__icon" id="growth-chart-icon"></span>
        <h2 id="growth-chart-title">Over Time</h2>
      </div>
      <canvas id="growth-chart"></canvas>
      <p class="subtext" id="growth-chart-empty" style="display:none;text-align:center;padding:var(--space-lg) 0;"></p>
    </section>

    <section class="section">
      <div class="section-head"><h2>History</h2></div>
      <div class="log-list" id="growth-history"></div>
    </section>
  </main>

  <div id="bottom-nav-mount"></div>
</div>

<script defer src="js/utils.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/icons.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/components.js"></script>
<script defer src="js/logedit.js"></script>
<script defer src="js/skeleton.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/notification.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="js/supabase-client.js"></script>
<script defer src="js/push.js"></script>
<script defer src="js/scheduler.js"></script>
<script defer src="js/feeding.js"></script>
<script defer src="js/sleep.js"></script>
<script defer src="js/charts.js"></script>
<script defer src="js/export.js"></script>
<script defer src="js/share.js"></script>
<script defer src="js/backup.js"></script>
<script defer src="js/logic.js"></script>
<script defer src="js/milestones.js"></script>
<script defer src="js/growth.js"></script>
<script defer src="js/tools.js"></script>
<script defer src="js/tracker.js"></script>
<script defer src="js/pages.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/router.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  (async () => {
    App.mountShell({ title: 'Growth Tracker', activeHref: '', showBack: true, backHref: 'tools.html' });
    Skeleton.show('growth');
    await Auth.init();
    const initial = new URLSearchParams(window.location.search).get('metric');
    GrowthTracker.init(initial);
  })();
});
</script>
</body>
</html>
