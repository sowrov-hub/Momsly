<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign Up — Momsly</title>
<meta name="theme-color" content="#F472B6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,500&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="auth-screen">
  <div class="auth-blob"></div>
  <div class="auth-blob auth-blob--2"></div>
  <div class="auth-content">
    <a class="auth-back" href="welcome.html" id="auth-back">Back</a>
    <div class="auth-logo">
      <img class="brand-mark" src="assets/icons/icon-192.png" alt="Momsly">
      <h1 class="auth-title">Start your 7-day trial</h1>
      <p class="auth-subtitle">Free for 7 days, then Lifetime Premium. Cancel anytime.</p>
    </div>

    <form id="signup-form">
      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" placeholder="Jane Doe" required autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        <div class="field-error" id="email-error"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password"></button>
        </div>
        <div class="field-hint">Used only on this device — Momsly has no servers.</div>
      </div>
      <label class="checkbox-row" style="margin-bottom:20px;">
        <input type="checkbox" id="agree" required>
        <span>I agree to the <a href="terms.html" style="color:var(--color-primary);font-weight:600;">Terms</a> & <a href="privacy.html" style="color:var(--color-primary);font-weight:600;">Privacy Policy</a></span>
      </label>
      <button class="btn btn--primary" type="submit" id="signup-submit">Start Free Trial</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>
</div>

<script defer src="js/utils.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/icons.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/components.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/notification.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="js/supabase-client.js"></script>
<script defer src="js/push.js"></script>
<script defer src="js/scheduler.js"></script>
<script defer src="js/feeding.js"></script>
<script defer src="js/sleep.js"></script>
<script defer src="js/charts.js"></script>
<script defer src="js/export.js"></script>
<script defer src="js/share.js"></script>
<script defer src="js/backup.js"></script>
<script defer src="js/logic.js"></script>
<script defer src="js/milestones.js"></script>
<script defer src="js/tools.js"></script>
<script defer src="js/tracker.js"></script>
<script defer src="js/pages.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/router.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('auth-back')?.insertAdjacentHTML('afterbegin', Icons.arrowLeft);
  (async () => {
    await Auth.init();
  
    document.getElementById('toggle-password').innerHTML = Icons.eye;
    document.getElementById('toggle-password').addEventListener('click', () => {
      const input = document.getElementById('password');
      const isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';
      document.getElementById('toggle-password').innerHTML = isPw ? Icons.eyeOff : Icons.eye;
    });
  
    if (Auth.isLoggedIn()) { window.location.href = 'index.html'; return; }
  
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.querySelectorAll('.field').forEach(f => f.classList.remove('has-error'));
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
  
      if (!Auth.isValidEmail(email)) {
        document.getElementById('email').closest('.field').classList.add('has-error');
        document.getElementById('email-error').textContent = 'Enter a valid email address.';
        return;
      }
      if (password.length < 6) {
        UI.toast('Password must be at least 6 characters.', 'error');
        return;
      }
  
      const btn = document.getElementById('signup-submit');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating your account…';
  
      const result = await Auth.signup({ name, email, password });
      if (!result.ok) {
        btn.disabled = false;
        btn.textContent = 'Start Free Trial';
        UI.toast(result.error, 'error');
        return;
      }
  
      if (result.needsConfirmation) {
        // This Supabase project requires email confirmation before login —
        // there's no session yet, so we can't send them to the app.
        btn.disabled = false;
        btn.textContent = 'Start Free Trial';
        document.getElementById('signup-form').style.display = 'none';
        document.querySelector('.auth-title').textContent = 'Check your email';
        document.querySelector('.auth-subtitle').textContent = `We sent a confirmation link to ${email}. Click it, then come back and log in.`;
        return;
      }
  
      UI.toast(`Welcome to Momsly, ${name.split(' ')[0]}!`, 'success');
      setTimeout(() => window.location.href = 'index.html', 500);
    });
  })();
});
</script>
</body>
</html>
