<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome — Momsly</title>
<meta name="description" content="Momsly — your calm, supportive space for modern parenting.">
<meta name="theme-color" content="#F472B6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,500&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="welcome-screen">
  <div class="auth-blob"></div>
  <div class="auth-blob auth-blob--2"></div>

  <div class="welcome-content">
    <div class="welcome-art">
      <img src="assets/images/hero-mom-baby.png" alt="A mother holding her sleeping baby">
    </div>

    <div class="welcome-copy">
      <img class="welcome-mark" src="assets/icons/icon-192.png" alt="">
      <h1>Welcome to Momsly</h1>
      <p>Your calm, supportive space for modern parenting.</p>
    </div>

    <div class="welcome-actions">
      <a class="btn btn--primary" href="signup.html" id="welcome-start">Get Started</a>
      <a class="btn btn--secondary" href="login.html">Log In</a>
      <p class="welcome-terms">
        By continuing you agree to our
        <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.
      </p>
    </div>
  </div>
</div>

<script defer src="js/utils.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/icons.js"></script>
<script defer src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // No Auth here on purpose: this is the public front door, so it must
  // never bounce a signed-out visitor to the login screen.
  document.getElementById('welcome-start').insertAdjacentHTML('beforeend', Icons.arrowRight);
});
</script>
</body>
</html>
