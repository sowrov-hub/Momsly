<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker — Momsly</title>
<meta name="theme-color" content="#F472B6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="app-shell">
  <div id="app-header-mount"></div>

  <main class="screen">
    <div class="tracker-tabs" id="tracker-tabs"></div>
    <div class="tracker-subtabs" id="tracker-subtabs" style="display:none;"></div>

    <div class="section" id="timer-card-wrap"></div>

    <div class="section">
      <div class="card" id="quick-form"></div>
    </div>

    <div class="section card chart-card" id="chart-wrap" style="display:none;">
      <div class="chart-card__head">
        <span class="chart-card__icon" id="chart-icon"></span>
        <h2 id="chart-title">Trend</h2>
      </div>
      <div class="chart-card__stats" id="chart-stats"></div>
      <canvas id="tracker-chart"></canvas>
    </div>

    <div class="section">
      <div class="section-head"><h2>History</h2></div>
      <div class="card" id="history-list"></div>
    </div>
  </main>

  <div id="bottom-nav-mount"></div>
</div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script src="js/auth.js"></script>
<script src="js/notification.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/push.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/feeding.js"></script>
<script src="js/sleep.js"></script>
<script src="js/charts.js"></script>
<script src="js/export.js"></script>
<script src="js/share.js"></script>
<script src="js/backup.js"></script>
<script src="js/logic.js"></script>
<script src="js/milestones.js"></script>
<script src="js/tools.js"></script>
<script src="js/tracker.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
<script src="js/router.js"></script>
<script>
  App.mountShell({ title: 'Tracker', activeHref: 'tracker.html' });
  const params = new URLSearchParams(window.location.search);
  const initialTab = params.get('tab');
  Tracker.init(initialTab);
  if (params.get('timer') === '1') {
    document.getElementById('timer-card-wrap')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
</script>
</body>
</html>
