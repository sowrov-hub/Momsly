<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker — Momsly</title>
<meta name="theme-color" content="#F472B6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,500&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="app-shell">
  <div id="app-header-mount"></div>

  <main class="screen">
    <div class="tracker-tabs" id="tracker-tabs"></div>
    <div class="tracker-subtabs" id="tracker-subtabs" style="display:none;"></div>

    <div class="section" id="timer-card-wrap"></div>

    <div class="section">
      <div class="card" id="quick-form"></div>
    </div>

    <div class="section card chart-card" id="chart-wrap" style="display:none;">
      <div class="chart-card__head">
        <span class="chart-card__icon" id="chart-icon"></span>
        <h2 id="chart-title">Trend</h2>
      </div>
      <div class="chart-card__stats" id="chart-stats"></div>
      <canvas id="tracker-chart"></canvas>
      <div id="chart-point-detail" class="subtext" style="text-align:center;margin-top:10px;font-weight:700;color:var(--color-primary);display:none;"></div>
    </div>

    <div class="section">
      <div class="section-head"><h2>History</h2></div>
      <div class="log-list" id="history-list"></div>
    </div>
  </main>

  <div id="bottom-nav-mount"></div>
</div>

<script defer src="js/utils.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/icons.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/components.js"></script>
<script defer src="js/logedit.js"></script>
<script defer src="js/skeleton.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/notification.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="js/supabase-client.js"></script>
<script defer src="js/push.js"></script>
<script defer src="js/scheduler.js"></script>
<script defer src="js/feeding.js"></script>
<script defer src="js/sleep.js"></script>
<script defer src="js/charts.js"></script>
<script defer src="js/export.js"></script>
<script defer src="js/share.js"></script>
<script defer src="js/backup.js"></script>
<script defer src="js/logic.js"></script>
<script defer src="js/milestones.js"></script>
<script defer src="js/tools.js"></script>
<script defer src="js/tracker.js"></script>
<script defer src="js/pages.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/router.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    (async () => {
      App.mountShell({ title: 'Tracker', activeHref: 'tracker.html' });
    Skeleton.show('tracker');
    await Auth.init();
      const params = new URLSearchParams(window.location.search);
      const initialTab = params.get('tab');
      Tracker.init(initialTab);
      if (params.get('timer') === '1') {
        document.getElementById('timer-card-wrap')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    })();
});
</script>
</body>
</html>
