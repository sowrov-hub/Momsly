<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medicine &amp; Health — Momsly</title>
<meta name="theme-color" content="#F472B6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,500&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="app-shell">
  <div id="app-header-mount"></div>

  <main class="screen">
    <header class="mh-head">
      <h1>Medicine &amp; Health</h1>
      <p>Track your baby's health, medications, and vaccination schedule.</p>
    </header>

    <section class="section">
      <div class="section-head">
        <h2>Active Medications</h2>
        <button class="mh-add-btn" id="add-medication-btn">Add New</button>
      </div>
      <div class="mh-grid" id="medications-grid"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2>Vaccination Schedule</h2></div>
      <div class="mh-card mh-card--pad" id="vaccine-timeline"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2>Recent Health Logs</h2></div>
      <div class="mh-metrics" id="health-logs"></div>
    </section>
  </main>

  <div id="bottom-nav-mount"></div>
</div>

<!-- Add medication sheet -->
<div class="overlay" id="sheet-add-medication">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2>Add Medication</h2><button class="icon-btn" data-close-sheet></button></div>
    <form id="medication-form">
      <div class="field"><label for="med-name">Medication</label><input type="text" id="med-name" placeholder="Vitamin D Drops" required></div>
      <div class="field"><label for="med-dose">Dose</label><input type="text" id="med-dose" placeholder="400 IU · 1 drop"></div>
      <div class="field">
        <label for="med-schedule">Schedule</label>
        <select id="med-schedule">
          <option value="daily">Daily, at a set time</option>
          <option value="asneeded">As needed</option>
        </select>
      </div>
      <div class="field" id="med-time-field"><label for="med-time">Time</label><input type="time" id="med-time" value="08:00"></div>
      <button class="btn btn--primary" type="submit">Add Medication</button>
      <p class="field-hint" style="margin-top:10px;">A daily medication also creates a reminder, so you get notified at that time.</p>
    </form>
  </div>
</div>

<script defer src="js/utils.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/icons.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/components.js"></script>
<script defer src="js/logedit.js"></script>
<script defer src="js/skeleton.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/notification.js"></script>

<script>window.SupabaseClient={isConfigured:()=>false,get:()=>null,ensureAnonymousSession:async()=>null};</script>
<script defer src="js/push.js"></script>
<script defer src="js/scheduler.js"></script>
<script defer src="js/feeding.js"></script>
<script defer src="js/sleep.js"></script>
<script defer src="js/charts.js"></script>
<script defer src="js/export.js"></script>
<script defer src="js/share.js"></script>
<script defer src="js/backup.js"></script>
<script defer src="js/logic.js"></script>
<script defer src="js/milestones.js"></script>
<script defer src="js/medicine.js"></script>
<script defer src="js/tools.js"></script>
<script defer src="js/tracker.js"></script>
<script defer src="js/pages.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/router.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  (async () => {
    App.mountShell({ title: 'Medicine & Health', activeHref: '', showBack: true, backHref: 'tools.html' });
    Skeleton.show('medicine');
    
    Storage.reset();
    const cid = 'c1';
    const dob = new Date(); dob.setMonth(dob.getMonth() - 5);
    Storage.set('children', [{ id: cid, name: 'Ava', dob: dob.toISOString(), sex: 'female', bloodGroup: 'O+', avatarColor: '#F472B6' }]);
    Storage.set('activeChildId', cid);
    const at = (d, h, m) => { const x = new Date(); x.setDate(x.getDate() - d); x.setHours(h, m, 0, 0); return x.toISOString(); };
    const logs = [];
    [[7,30],[11,15],[14,45],[18,10]].forEach(([h,m]) => logs.push({ id: Utils.uid(), childId: cid, type: 'feeding', amount: 4, note: '', timestamp: at(0,h,m) }));
    logs.push({ id: Utils.uid(), childId: cid, type: 'sleep', duration: 5400000, note: '', timestamp: at(0,13,0) });
    logs.push({ id: Utils.uid(), childId: cid, type: 'diaper', diaperType: 'Wet', note: '', timestamp: at(0,9,5) });
    logs.push({ id: Utils.uid(), childId: cid, type: 'temperature', value: 98.6, note: '', timestamp: at(2,16,0) });
    for (let d = 1; d < 26; d++) {
      logs.push({ id: Utils.uid(), childId: cid, type: 'feeding', amount: 4, note: '', timestamp: at(d,9,0) });
      if (d % 4 === 0) logs.push({ id: Utils.uid(), childId: cid, type: 'weight', value: 11 + d * 0.06, note: '', timestamp: at(d,10,0) });
      if (d % 5 === 0) logs.push({ id: Utils.uid(), childId: cid, type: 'height', value: 22 + d * 0.05, note: '', timestamp: at(d,10,0) });
    }
    Storage.set('logs', logs);
    Storage.set('milestones', [{ id: Utils.uid(), childId: cid, title: 'First smile', date: at(0,11,0), note: 'So cute', done: true }]);
    Storage.set('medications', [
      { id: 'm1', childId: cid, name: 'Vitamin D Drops', dose: '400 IU · 1 drop', schedule: 'daily', time: '08:00', reminderId: null, createdAt: at(30,8,0) },
      { id: 'm2', childId: cid, name: 'Infant Tylenol', dose: '2.5 ml · for fever', schedule: 'asneeded', time: null, reminderId: null, createdAt: at(20,8,0) },
    ]);
    Storage.set('reminders', [
      { id: 'r1', title: "Ava's 6-month check-up", category: 'health', icon: 'calendar', repeat: 'once', time: new Date(Date.now() + 76*86400000).toISOString(), every: null, enabled: true, lastFiredAt: null, snoozedUntil: null, createdAt: at(1,9,0) },
      { id: 'r2', title: 'Vitamin D', category: 'medicine', icon: 'medicine', repeat: 'daily', time: at(0,8,0), every: null, enabled: true, lastFiredAt: null, snoozedUntil: null, createdAt: at(5,8,0) },
    ]);

    MedicineHealth.init();
  })();
});
</script>
</body>
</html>
