<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log In — Momsly</title>
<meta name="theme-color" content="#F472B6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="auth-screen">
  <div class="auth-blob"></div>
  <div class="auth-blob auth-blob--2"></div>
  <div class="auth-content">
    <div class="auth-logo">
      <img class="brand-mark" src="assets/icons/icon-192.png" alt="Momsly">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to pick up right where you left off.</p>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        <div class="field-error" id="email-error"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password"></button>
        </div>
        <div class="field-error" id="password-error"></div>
      </div>
      <div style="text-align:right;margin-bottom:16px;">
        <a href="forgot-password.html" style="font-size:13px;color:var(--color-primary);font-weight:600;">Forgot password?</a>
      </div>
      <button class="btn btn--primary" type="submit" id="login-submit">Log In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Sign up free</a>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script src="js/auth.js"></script>
<script src="js/notification.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/feeding.js"></script>
<script src="js/sleep.js"></script>
<script src="js/charts.js"></script>
<script src="js/export.js"></script>
<script src="js/share.js"></script>
<script src="js/backup.js"></script>
<script src="js/logic.js"></script>
<script src="js/milestones.js"></script>
<script src="js/tools.js"></script>
<script src="js/tracker.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
<script src="js/router.js"></script>
<script>
  document.getElementById('toggle-password').innerHTML = Icons.eye;

  document.getElementById('toggle-password').addEventListener('click', () => {
    const input = document.getElementById('password');
    const isPw = input.type === 'password';
    input.type = isPw ? 'text' : 'password';
    document.getElementById('toggle-password').innerHTML = isPw ? Icons.eyeOff : Icons.eye;
  });

  if (Auth.isLoggedIn()) window.location.href = 'index.html';

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    document.querySelectorAll('.field').forEach(f => f.classList.remove('has-error'));
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!Auth.isValidEmail(email)) {
      document.getElementById('email').closest('.field').classList.add('has-error');
      document.getElementById('email-error').textContent = 'Enter a valid email address.';
      return;
    }

    const btn = document.getElementById('login-submit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Logging in…';

    setTimeout(() => {
      const result = Auth.login({ email, password });
      if (!result.ok) {
        btn.disabled = false;
        btn.textContent = 'Log In';
        document.getElementById('password').closest('.field').classList.add('has-error');
        document.getElementById('password-error').textContent = result.error;
        UI.toast(result.error, 'error');
        return;
      }
      UI.toast(`Welcome back, ${result.user.name.split(' ')[0]}!`, 'success');
      setTimeout(() => window.location.href = 'index.html', 400);
    }, 500);
  });
</script>
</body>
</html>
